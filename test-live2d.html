<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live2D Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0a0a0f;
      font-family: 'Courier New', monospace;
      color: #00ffff;
    }
    #canvas {
      border: 1px solid #00ffff;
      margin: 20px 0;
    }
    .info {
      margin: 10px 0;
      padding: 10px;
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid rgba(0, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <h1>Live2D Model Test</h1>
  <div class="info">
    <p>Model URL: /models/live2d-model.json</p>
    <p>Status: <span id="status">Loading...</span></p>
    <p>Error: <span id="error">None</span></p>
  </div>
  <div id="canvas"></div>
  <div class="info">
    <p>Controls:</p>
    <ul>
      <li>Click on the character to trigger animations</li>
      <li>Check browser console for logs</li>
    </ul>
  </div>

  <script src="/live2dcubismcore.js"></script>
  <script type="module" src="/test-live2d.js"></script>
</body>
</html>
