<!DOCTYPE html>
<html>
<head>
  <title>Test Live2D Loading</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0a0a0f;
      font-family: 'Share Tech Mono', monospace;
      color: #00ffff;
    }
    #debug {
      font-size: 12px;
      line-height: 1.6;
    }
    .success { color: #00ff00; }
    .error { color: #ff0066; }
    .info { color: #00ffff; }
  </style>
</head>
<body>
  <h1>Live2D Model Loading Test</h1>
  <div id="debug"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/pixi-live2d-display.min.js"></script>
  <script>
    const debug = document.getElementById('debug');

    async function testLive2D() {
      try {
        debug.innerHTML += '<p class="info">Starting Live2D test...</p>';

        // Test 1: Check if PIXI is loaded
        debug.innerHTML += '<p class="info">Test 1: PIXI.js version: ' + PIXI.VERSION + '</p>';

        // Test 2: Check if Live2DModel is available
        if (typeof Live2DModel !== 'undefined') {
          debug.innerHTML += '<p class="success">Test 2: Live2DModel is available</p>';
        } else {
          debug.innerHTML += '<p class="error">Test 2: Live2DModel is NOT available</p>';
          return;
        }

        // Test 3: Try to load a model
        debug.innerHTML += '<p class="info">Test 3: Attempting to load model...</p>';

        try {
          const model = await Live2DModel.from('/models/Haru/Haru.model3.json');
          debug.innerHTML += '<p class="success">Test 3: Model loaded successfully!</p>';
          debug.innerHTML += '<p class="info">Model dimensions: ' + model.width + 'x' + model.height + '</p>';
        } catch (err) {
          debug.innerHTML += '<p class="error">Test 3: Failed to load model: ' + err.message + '</p>';
          debug.innerHTML += '<p class="info">This might be expected if running from file:// protocol</p>';
        }

        debug.innerHTML += '<p class="success">Test completed!</p>';

      } catch (error) {
        debug.innerHTML += '<p class="error">Error: ' + error.message + '</p>';
        debug.innerHTML += '<p class="error">Stack: ' + error.stack + '</p>';
      }
    }

    testLive2D();
  </script>
</body>
</html>
