<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AIPET Pet</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: transparent;
  -webkit-app-region: drag;
  user-select: none;
}
#canvas-container {
  width: 100vw;
  height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>
<body>
<div id="canvas-container"></div>
<script src="live2dcubismcore.js"></script>
<script>
// Minimal pet mode — only renders the Live2D model on transparent background
(async function() {
  const params = new URLSearchParams(location.search);
  const modelUrl = params.get('model') || './models/Haru/Haru.model3.json';

  // Load PIXI from CDN
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.8/pixi.min.js');
  await loadScript('https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/index.min.js');

  const { Live2DModel } = window;
  Live2DModel.registerTicker(PIXI.Ticker);

  const app = new PIXI.Application({
    width: window.innerWidth,
    height: window.innerHeight,
    transparent: true,
    antialias: true,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true,
  });
  document.getElementById('canvas-container').appendChild(app.view);

  try {
    const model = await Live2DModel.from(modelUrl);
    const scale = Math.min(
      (app.screen.width * 0.85) / model.width,
      (app.screen.height * 0.85) / model.height,
      0.12
    );
    model.scale.set(scale);
    model.x = app.screen.width / 2;
    model.y = app.screen.height / 2;
    model.anchor.set(0.5, 0.5);
    app.stage.addChild(model);

    // Idle animations
    setInterval(() => {
      const motions = ['Idle', 'TapBody', 'TapHead'];
      try { model.motion(motions[Math.floor(Math.random() * motions.length)]); } catch {}
    }, 10000 + Math.random() * 5000);
  } catch (e) {
    console.error('Pet model load failed:', e);
  }

  // Listen for model change from main process
  window.addEventListener('message', (event) => {
    if (event.data.type === 'change-model' && event.data.url) {
      location.search = '?model=' + encodeURIComponent(event.data.url);
      location.reload();
    }
  });
})();

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
</script>
</body>
</html>
