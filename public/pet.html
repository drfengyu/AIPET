<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AIPET Pet</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: transparent;
  -webkit-app-region: drag;
  user-select: none;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
#loading {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: rgba(255,255,255,0.12);
  font-size: 11px; letter-spacing: 1px; gap: 8px;
}
#loading .spinner {
  width: 18px; height: 18px;
  border: 2px solid rgba(0,255,255,0.08);
  border-top-color: rgba(0,255,255,0.3);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bubble-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
#error {
  display: none;
  position: absolute; bottom: 16px; left: 16px; right: 16px;
  color: rgba(255,100,100,0.6);
  font-size: 10px; text-align: center; line-height: 1.5; word-break: break-all;
}
#canvas-container {
  width: 100vw; height: 100vh;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
#model-label {
  position: absolute; bottom: 10px; left: 0; right: 0;
  text-align: center;
  color: rgba(255,255,255,0.06);
  font-size: 9px; letter-spacing: 2px;
  pointer-events: none;
}
#pet-speech {
  display: none;
  position: absolute; bottom: 25%; left: 10%; right: 10%;
  z-index: 10; pointer-events: none;
  animation: bubble-in 0.3s ease;
}
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <span id="loading-text">加载模型中...</span>
</div>
<div id="canvas-container"></div>
<div id="model-label"></div>
<div id="error"></div>
<div id="pet-speech">
  <div style="background:rgba(10,10,20,0.8);border:1px solid rgba(0,255,255,0.12);border-radius:8px;border-bottom-left-radius:2px;padding:8px 12px;font-size:11px;line-height:1.5;color:#c0c0d8;font-family:'Segoe UI',system-ui,sans-serif;font-weight:300;text-align:center;">
    <span id="pet-speech-text"></span>
  </div>
  <div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid rgba(0,255,255,0.12);margin-left:16px;"></div>
</div>

<script src="live2dcubismcore.js"></script>
<script src="./lib/pixi.min.js"></script>
<script>
// 全局错误捕获
window.onerror = function(msg, url, line, col, err) {
  var el = document.getElementById('error');
  el.textContent = '⚠ ' + (err ? (err.message || err) : msg);
  el.style.display = 'block';
  document.getElementById('loading').style.display = 'none';
  return true;
};
window.addEventListener('unhandledrejection', function(e) {
  var el = document.getElementById('error');
  el.textContent = '⚠ Promise: ' + (e.reason ? (e.reason.message || e.reason) : e);
  el.style.display = 'block';
  document.getElementById('loading').style.display = 'none';
});

// 聊天气泡（通过 IPC 调用）
window.showPetSpeech = function(text) {
  var el = document.getElementById('pet-speech');
  var textEl = document.getElementById('pet-speech-text');
  if (!el || !textEl) return;
  textEl.textContent = text.length > 80 ? text.slice(0, 80) + '...' : text;
  el.style.display = 'block';
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.animation = 'bubble-in 0.3s ease';
  if (window._petSpeechTimer) clearTimeout(window._petSpeechTimer);
  window._petSpeechTimer = setTimeout(function() {
    el.style.display = 'none';
  }, 6000);
};

(function() {
  const params = new URLSearchParams(location.search);
  const modelUrl = params.get('model') || './models/Haru/Haru.model3.json';
  const modelName = modelUrl.split('/').slice(-2, -1)[0] || 'Model';
  document.getElementById('model-label').textContent = modelName;
  document.getElementById('loading-text').textContent = '加载 ' + modelName + '...';

  function showError(msg) {
    var el = document.getElementById('error');
    el.textContent = '⚠ ' + msg;
    el.style.display = 'block';
    document.getElementById('loading').style.display = 'none';
  }

  var s = document.createElement('script');
  s.src = './lib/cubism4.min.js';
  s.onload = function() {
    try { initPet(); } catch (e) { showError('初始化失败: ' + (e.message || e)); }
  };
  s.onerror = function() { showError('无法加载 Live2D 渲染库'); };
  document.head.appendChild(s);

  function initPet() {
    var Live2DModel = window.PIXI?.live2d?.Live2DModel;
    if (!Live2DModel || !window.PIXI) {
      showError('渲染库加载失败');
      return;
    }
    Live2DModel.registerTicker(window.PIXI.Ticker);

    var app = new window.PIXI.Application({
      width: window.innerWidth,
      height: window.innerHeight,
      transparent: true,
      antialias: true,
      resolution: window.devicePixelRatio || 1,
      autoDensity: true,
    });
    document.getElementById('canvas-container').appendChild(app.view);

    Live2DModel.from(modelUrl).then(function(model) {
      var scale = Math.min(
        (app.screen.width * 0.85) / model.width,
        (app.screen.height * 0.85) / model.height,
        0.12
      );
      model.scale.set(scale);
      model.x = app.screen.width / 2;
      model.y = app.screen.height / 2;
      model.anchor.set(0.5, 0.5);
      app.stage.addChild(model);
      document.getElementById('loading').style.display = 'none';

      var motions = ['Idle', 'TapBody', 'TapHead'];
      setInterval(function() {
        try { model.motion(motions[Math.floor(Math.random() * motions.length)]); } catch(e) {}
      }, 10000 + Math.random() * 5000);
    }).catch(function(e) {
      showError('模型加载失败: ' + (e.message || e));
    });

    window.addEventListener('resize', function() {
      app.renderer.resize(window.innerWidth, window.innerHeight);
    });
  }
})();
</script>
</body>
</html>
