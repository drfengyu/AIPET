<!DOCTYPE html>
<html>
<head>
  <title>Test AIPET App</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0a0a0f;
      font-family: 'Share Tech Mono', monospace;
    }
    #container {
      width: 400px;
      height: 500px;
      border: 2px solid #00ff00;
      position: relative;
      background: linear-gradient(135deg, #00ffff 0%, #ff00ff 100%);
    }
    #debug {
      color: #00ffff;
      margin-top: 20px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1 style="color: #00ffff;">AIPET Test</h1>
  <div id="container">
    <div id="viewer" style="width: 100%; height: 100%; background: linear-gradient(180deg, #0a0a12 0%, #151525 100%); border: 2px solid #00ff00;"></div>
  </div>
  <div id="debug"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
  <script>
    const viewer = document.getElementById('viewer');
    const debug = document.getElementById('debug');

    try {
      // Get container dimensions
      const containerWidth = viewer.clientWidth || 400;
      const containerHeight = viewer.clientHeight || 500;

      debug.innerHTML = `Container: ${containerWidth}x${containerHeight}<br>`;

      // Create PIXI application
      const app = new PIXI.Application({
        width: containerWidth,
        height: containerHeight,
        backgroundColor: 0x0a0a12,
        antialias: true,
      });

      // Add to DOM
      viewer.appendChild(app.view);
      const canvas = app.view;
      canvas.style.display = 'block';
      canvas.style.position = 'absolute';
      canvas.style.top = '50%';
      canvas.style.left = '50%';
      canvas.style.transform = 'translate(-50%, -50%)';

      debug.innerHTML += `Canvas created: ${canvas.width}x${canvas.height}<br>`;
      debug.innerHTML += `Canvas style: ${canvas.style.cssText}<br>`;

      // Add a simple graphic to verify rendering
      const graphics = new PIXI.Graphics();
      graphics.beginFill(0x00ffff);
      graphics.drawCircle(containerWidth / 2, containerHeight / 2, 50);
      graphics.endFill();
      app.stage.addChild(graphics);

      debug.innerHTML += 'Added cyan circle to stage<br>';
      debug.innerHTML += 'Success: PIXI application is running!';

    } catch (error) {
      debug.innerHTML = `Error: ${error.message}<br>${error.stack}`;
    }
  </script>
</body>
</html>
