<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIPET NEURAL INTERFACE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1e1e34;
      font-family: 'Share Tech Mono', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root { width: 100%; height: 100vh; }

    /* ============ Global Interactive Styles ============ */
    .top-btn {
      background: rgba(0,200,255,0.05);
      border: 1px solid rgba(0,200,255,0.15);
      color: rgba(0,200,255,0.4);
      padding: 6px 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.15s;
      border-radius: 4px;
    }
    .top-btn:hover {
      background: rgba(0,200,255,0.08);
      border-color: rgba(0,200,255,0.25);
      color: rgba(0,200,255,0.55);
    }
    .top-btn:active {
      opacity: 0.7;
    }

    .chat-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(0,200,255,0.08);
      border-radius: 4px;
      color: rgba(230,230,250,0.3);
      cursor: pointer;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      transition: all 0.15s;
      padding: 4px 8px;
      line-height: 1;
    }
    .chat-btn:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(0,200,255,0.15);
      color: rgba(230,230,250,0.5);
    }

    .model-pill {
      padding: 4px 12px;
      border: 1px solid rgba(0,200,255,0.08);
      background: rgba(0,200,255,0.03);
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      color: rgba(0,200,255,0.25);
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 4px;
    }
    .model-pill:hover {
      border-color: rgba(0,200,255,0.2);
      color: rgba(0,200,255,0.4);
      background: rgba(0,200,255,0.05);
    }

    /* ============ Animations ============ */
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(-10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes float-particle {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.3; }
      100% { transform: translateY(-600px) scale(0.5); opacity: 0; }
    }
    @keyframes rotate-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ============ Scrollbar ============ */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.04);
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.08); }

    button, select, input[type="text"] {
      transition: all 0.2s ease !important;
    }

    button:active {
      opacity: 0.85;
    }

    .model-pill:hover {
      border-color: rgba(0,255,255,0.3) !important;
      color: #00ffff !important;
    }

    .top-btn {
      letter-spacing: 1.5px;
    }
    .top-btn:hover {
      border-color: rgba(0,255,255,0.4) !important;
      color: #00ffff !important;
      box-shadow: 0 0 8px rgba(0,255,255,0.12) !important;
    }

    .chat-btn:hover {
      background: rgba(255,255,255,0.05) !important;
      color: rgba(0,255,255,0.6) !important;
    }

    .send-btn:hover {
      background: rgba(0,204,255,0.12) !important;
      color: rgba(0,204,255,0.7) !important;
      border-color: rgba(0,204,255,0.25) !important;
    }

    /* ============ Animations ============ */
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(100vh); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 4px rgba(0,255,255,0.15); }
      50% { box-shadow: 0 0 16px rgba(0,255,255,0.3); }
    }
    @keyframes float-particle {
      0% { transform: translateY(100%) translateX(0); opacity: 0; }
      10% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(-10vh) translateX(15px); opacity: 0; }
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes viz-bar {
      0% { height: 3px; opacity: 0.3; }
      100% { height: 14px; opacity: 0.8; }
    }
    @keyframes rotate-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dot-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.15); border-radius: 2px; }
    ::selection { background: rgba(0, 255, 255, 0.25); color: #ffffff; }
    input:focus, button:focus, select:focus { outline: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="live2dcubismcore.js"></script>
  <script type="module" src="src/renderer/index.tsx"></script>
</body>
</html>
