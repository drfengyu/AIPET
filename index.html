<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIPET NEURAL INTERFACE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #07070f;
      font-family: 'Share Tech Mono', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root { width: 100%; height: 100vh; }

    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(100vh); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 4px rgba(0,255,255,0.15); }
      50% { box-shadow: 0 0 16px rgba(0,255,255,0.3); }
    }
    @keyframes float-particle {
      0% { transform: translateY(100%) translateX(0); opacity: 0; }
      10% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(-10vh) translateX(15px); opacity: 0; }
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes viz-bar {
      0% { height: 3px; opacity: 0.3; }
      100% { height: 14px; opacity: 0.8; }
    }
    @keyframes rotate-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dot-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.15); border-radius: 2px; }
    ::selection { background: rgba(0, 255, 255, 0.25); color: #ffffff; }
    input:focus, button:focus, select:focus { outline: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="live2dcubismcore.js"></script>
  <script type="module" src="src/renderer/index.tsx"></script>
</body>
</html>
